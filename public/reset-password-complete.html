<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password reset — Famotive</title>
<meta name="description" content="Your Famotive password has been reset." />
<style>
  :root {
    --primary-blue: #2455C9;
    --growth-green: #43A047;
    --surface-light: #F7F9FC;
    --text-dark: #1A1E27;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-light);
    color: var(--text-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .emoji { font-size: 56px; line-height: 1; }
  h1 { font-size: 24px; margin: 16px 0 8px; }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: #3a4150;
    margin: 0 0 24px;
  }
  .hint {
    font-size: 13px;
    color: #9aa3b2;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">✅</div>
    <h1>You're all set</h1>
    <p>
      Your Famotive password has been reset. Head back to the Famotive app
      and log in with your new password.
    </p>
    <p class="hint">
      This page is just a landing spot for the password-reset link when the
      Famotive app isn't installed on this device — you can close it now.
    </p>
  </div>
</body>
</html>
