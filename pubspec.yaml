name: famotive
description: "A family task/reward app for kids and parents."
publish_to: 'none'
version: 0.1.1+7

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Icon set used throughout the app (standard Flutter/iOS-style icons).
  cupertino_icons: ^1.0.8

  # Lightweight state management for session/auth state and the in-memory
  # "database" of households, tasks and rewards used during early development.
  provider: ^6.1.2

  # Date formatting/parsing for due dates, streaks and recurring tasks.
  intl: ^0.20.3

  # Firebase core for initializing the Firebase SDK.
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1

  # Native Google account picker for "Continue with Google" (the ID token
  # is handed to Firebase Auth). Apple sign-in needs no extra package: it
  # goes through firebase_auth's AppleAuthProvider. See
  # Documents/Social_Sign_In_Setup.md.
  google_sign_in: ^7.2.0

  # Calls the deleteAccount Cloud Function (in-app account deletion).
  cloud_functions: ^6.0.0

  # Push notifications (FCM). Sent by the Cloud Functions in functions/;
  # see lib/core/services/notification_service.dart.
  firebase_messaging: ^16.0.0

  # Parses the incoming https://famotive.org/__/auth/links deep link
  # (Android App Link / iOS Universal Link) that Firebase Auth's
  # password-reset emails open, so the reset can be completed in-app
  # instead of in a browser. See lib/core/services/deep_link_service.dart.
  app_links: ^7.2.1

  # Opens the mailto: link for Help & Support (Settings screen).
  url_launcher: ^6.3.1

  # Small on-device key/value store: remembers the light/dark mode choice
  # and each user's onboarding progress/completion between app launches.
  # See lib/core/services/theme_controller.dart and
  # lib/features/onboarding/onboarding_controller.dart.
  shared_preferences: ^2.5.3

  # Task photo proof.
  image_picker: ^1.1.2
  firebase_storage: ^13.0.0

  # Famotive Premium: subscriptions through the App Store / Google Play
  # (7-day free trial = the store's introductory offer). Purchases are
  # verified by the verifyPurchase Cloud Function; see
  # Documents/Premium_Setup.md and lib/core/services/premium_service.dart.
  in_app_purchase: ^3.2.0
  # Android-only product details (base plans / free-trial offers). Version
  # follows whatever in_app_purchase resolves.
  in_app_purchase_android: any
  # Derives the purchase's account token (a UUID) from the user id.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2

flutter:
  uses-material-design: true

  # Uncomment and add font files under assets/fonts/ once branding fonts
  # are finalized.
  # fonts:
  #   - family: Famotive
  #     fonts:
  #       - asset: assets/fonts/Famotive-Regular.ttf
  #       - asset: assets/fonts/Famotive-Bold.ttf
  #         weight: 700
